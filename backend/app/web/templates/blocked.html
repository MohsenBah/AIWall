{% extends "base.html" %}

{% block title %}AIWall - Blocked events{% endblock %}

{% block content %}
<section class="panel">
    <div class="panel-header">
        <div>
            <h1>Blocked events</h1>
            <p class="muted">Review the latest {{ event_limit }} blocked requests, per profile.</p>
        </div>
        <form id="blocked-filters" class="filters">
            <label>
                Profile
                <select name="profile">
                    <option value="" {% if not selected_profile %}selected{% endif %}>All profiles</option>
                    {% for p in profiles %}
                    <option value="{{ p.id }}" {% if selected_profile == p.id|string %}selected{% endif %}>{{ p.name }} ({{ p.role }})</option>
                    {% endfor %}
                </select>
            </label>
        </form>
    </div>

    <div
        id="blocked-table"
        hx-get="/partials/blocked"
        hx-trigger="change from:#blocked-filters, every 10s"
        hx-include="#blocked-filters"
    >
        {% include "partials/blocked_table.html" %}
    </div>
</section>
{% endblock %}
